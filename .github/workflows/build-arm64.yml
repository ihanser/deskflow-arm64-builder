name: Build Deskflow ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie-slim
      options: --platform linux/arm64
    timeout-minutes: 180
    steps:
      - name: Install git, CA certs, and build tools in container
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            git ca-certificates build-essential

      - uses: actions/checkout@v4
        with:
          repository: deskflow/deskflow
          submodules: recursive

      - name: Install deps (exact match to Pi)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libssl-dev libx11-dev libxext-dev libxfixes-dev libxi-dev \
            libxrandr-dev libxrender-dev libxcursor-dev libxtst-dev \
            libxinerama-dev libxkbcommon-dev libwayland-dev libudev-dev \
            libsystemd-dev libcurl4-openssl-dev libavahi-compat-libdnssd-dev \
            libxkbregistry-dev libei-dev libeis-dev libportal-dev \
            libxkbfile-dev x11proto-kb-dev \
            qt6-base-dev qt6-base-dev-tools qt6-5compat-dev qt6-tools-dev
          echo '--- X11 extensions dir ---'
          ls -la /usr/include/X11/extensions 2>/dev/null || true
          echo '--- XKBrules search ---'
          find /usr -name XKBrules.h 2>/dev/null || true
          echo '--- libxkbfile-dev files ---'
          dpkg -L libxkbfile-dev 2>/dev/null | grep -i xkb || true

      - name: Configure (Wayland-first: disable X11 to avoid XKBrules.h)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_X11_SUPPORT=OFF -DBUILD_INSTALLER=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist
          find build -maxdepth 3 -type f -executable -name "deskflow*" | xargs -I{} cp {} dist/ 2>/dev/null || true
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskflow-arm64
          path: dist/
          retention-days: 7
