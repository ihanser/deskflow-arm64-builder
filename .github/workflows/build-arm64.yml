name: Build Deskflow ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          repository: deskflow/deskflow
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libssl-dev libx11-dev libxext-dev libxfixes-dev libxi-dev \
            libxrandr-dev libxrender-dev libxcursor-dev libxtst-dev \
            libxinerama-dev libxkbcommon-dev libwayland-dev libudev-dev \
            libsystemd-dev libcurl4-openssl-dev libavahi-compat-libdnssd-dev \
            libxkbregistry-dev libei-dev libeis-dev libportal-dev \
            qt6-base-dev qt6-base-dev-tools qt6-5compat-dev qt6-tools-dev

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_X11_SUPPORT=ON -DBUILD_INSTALLER=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist
          cp build/bin/deskflow dist/ 2>/dev/null || true
          # Find and copy all built binaries
          find build -maxdepth 3 -type f -executable -name "deskflow*" | head -20 | xargs -I{} cp {} dist/ 2>/dev/null || true
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskflow-arm64
          path: dist/
          retention-days: 7
